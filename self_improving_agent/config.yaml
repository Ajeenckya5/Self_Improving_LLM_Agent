model:
  primary: "gpt-4"             # Main agent model (or "llama3-8b" via Ollama)
  analyzer: "gpt-4"            # Model for failure analysis + strategy generation
  embedding: "all-MiniLM-L6-v2"  # sentence-transformers model for retrieval

agent:
  max_steps: 25                # Maximum steps per task
  temperature: 0.7
  max_tokens: 1000

memory:
  db_path: "results/strategy_memory.db"
  top_k: 3                     # Number of strategies to retrieve per task
  similarity_threshold: 0.65   # Min cosine similarity for retrieval

evaluation:
  horizons: [5, 10, 15, 20]    # Task horizon lengths to test
  n_tasks_per_horizon: 25      # Tasks per horizon bucket
  benchmarks: ["agentbench_os", "webarena"]
  baselines: ["react", "plan_act", "no_memory"]

logging:
  llm_calls_log: "results/llm_calls.jsonl"
  level: "INFO"
